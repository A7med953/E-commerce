<app-main-slider></app-main-slider>
<app-category-slider
  [selectedId]="selectedCategory?._id ?? null"
  (selectCategory)="onSelectCategory($event)"
></app-category-slider>
@if (selectedCategory) {
  <app-product-list
    [categoryId]="selectedCategory._id"
    [title]="selectedCategory.name"
  ></app-product-list>
} @else {
  <app-product-list
    title="Best Sellers"
    sort="-sold"
    [limit]="10"
    [showViewAll]="true"
  ></app-product-list>
}
