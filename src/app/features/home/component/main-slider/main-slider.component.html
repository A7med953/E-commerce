<section class="pt-4">
  <div class="container">
    <div
      #carousel
      id="mainCarousel"
      class="carousel slide carousel-fade main-slider"
    >
      <div class="carousel-inner">
        @for (slide of slides; track slide; let i = $index) {
          <div class="carousel-item" [class.active]="i === 0">
            <img [src]="slide" class="d-block w-100" [alt]="'Offer ' + (i + 1)" />
          </div>
        }
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
        <span class="control-icon"><i class="fa-solid fa-chevron-left"></i></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
        <span class="control-icon"><i class="fa-solid fa-chevron-right"></i></span>
        <span class="visually-hidden">Next</span>
      </button>

      <div class="carousel-indicators">
        @for (slide of slides; track slide; let i = $index) {
          <button
            type="button"
            data-bs-target="#mainCarousel"
            [attr.data-bs-slide-to]="i"
            [class.active]="i === 0"
            [attr.aria-label]="'Slide ' + (i + 1)"
          ></button>
        }
      </div>
    </div>
  </div>
</section>
