<div
  id="mainCarousel"
  class="carousel slide carousel-fade"
  data-bs-ride="carousel"
  data-bs-interval="3000"
>
  <div class="carousel-inner shadow">
    <div class="carousel-item active">
      <img src="images/1.gif" class="d-block w-100" alt="" />
    </div>

    <div class="carousel-item">
      <img src="images/2.avif" class="d-block w-100" alt="" />
    </div>

    <div class="carousel-item">
      <img src="images/3.avif" class="d-block w-100" alt="" />
    </div>

    <div class="carousel-item">
      <img src="images/4.avif" class="d-block w-100" alt="" />
    </div>
  </div>

  <div class="carousel-indicators position-static mt-3 d-none d-md-flex">
    <button
      type="button"
      data-bs-target="#mainCarousel"
      data-bs-slide-to="0"
      class="active"
    ></button>
    <button
      type="button"
      data-bs-target="#mainCarousel"
      data-bs-slide-to="1"
    ></button>
    <button
      type="button"
      data-bs-target="#mainCarousel"
      data-bs-slide-to="2"
    ></button>
    <button
      type="button"
      data-bs-target="#mainCarousel"
      data-bs-slide-to="3"
    ></button>
  </div>
</div>
