<div class="col">
  <div class="product p-2">

    <img
      [src]="product.imageCover"
      class="product-img rounded-2"
      [routerLink]="['/product-details', product._id]"
      [alt]="product.title"
    />

    <h5 class="text-main mt-2">
      {{ product.category.name }}
    </h5>

    <h4
      class="fw-bold fs-6 line-clamp-1"
      [routerLink]="['/product-details', product._id]"
    >
      {{ product.title }}
    </h4>

    <div class="d-flex justify-content-between my-3">
      <span>{{ product.price }} EGP</span>

      <span>
        <i class="fa-solid fa-star text-rating"></i>
        {{ product.ratingsAverage }}
      </span>
    </div>

    <div class="text-center">
      <button
        class="btn bg-main text-white w-75 rounded-4"
        (click)="onAddToCart()"
      >
        Add to Cart
      </button>
    </div>

  </div>
</div>
