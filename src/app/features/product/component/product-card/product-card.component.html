<div class="col">
  <div class="product h-100 d-flex flex-column">
    <a [routerLink]="['/product-details', product._id]" class="product-img-wrap">
      <img
        [src]="product.imageCover"
        class="product-img"
        [alt]="product.title"
        loading="lazy"
      />
    </a>

    <div class="p-2 p-sm-3 d-flex flex-column flex-grow-1">
      <span class="product-category text-main">
        {{ product.category.name }}
      </span>

      <a
        class="product-title fw-bold line-clamp-1"
        [routerLink]="['/product-details', product._id]"
        [title]="product.title"
      >
        {{ product.title }}
      </a>

      <div class="d-flex justify-content-between align-items-center mt-auto pt-3">
        <span class="fw-semibold">{{ product.price }} EGP</span>
        <span class="small">
          <i class="fa-solid fa-star text-rating"></i>
          {{ product.ratingsAverage }}
        </span>
      </div>

      <button
        type="button"
        class="btn bg-main text-white w-100 mt-3 add-btn"
        (click)="onAddToCart()"
      >
        <i class="fa-solid fa-cart-plus me-1"></i>
        Add to Cart
      </button>
    </div>
  </div>
</div>
