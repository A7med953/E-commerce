<section class="py-5">
  <div class="container">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h2 class="fw-bold mb-0">{{ title }}</h2>
      @if (showViewAll) {
        <a routerLink="/products" class="text-main fw-semibold">
          View all <i class="fa-solid fa-arrow-right ms-1"></i>
        </a>
      }
    </div>

    @if (!isLoaded) {
      <div class="text-center py-5">
        <span class="spinner-border text-success" role="status"></span>
      </div>
    }

    <div
      class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-3 g-md-4"
    >
      @for (product of allProducts; track product._id) {
        <app-product-card [product]="product" (addToCart)="addProductToCart($event)" />
      }
    </div>
    @if (isLoaded && allProducts.length === 0) {
      <p class="text-center text-muted py-5 mb-0">
        No products found here yet.
      </p>
    }
  </div>
</section>
