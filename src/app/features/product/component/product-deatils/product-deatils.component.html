<section >
  <div class="container">
    <div class="row align-items-center">

      <div class="col-md-4 text-center">
        <img
          [src]="productDetails.imageCover"
          class="img-fluid rounded"
          [alt]="productDetails.title"
        />
      </div>

      <div class="col-md-8">
        <h1 class="fw-bold mb-3">{{ productDetails.title }}</h1>

        <p class="text-muted">
          {{ productDetails.description }}
        </p>

      <div class="border rounded-3 p-3 mt-4">

  <h3 class="text-success fw-bold">
    {{ productDetails.price }} EGP
  </h3>

  <div class="input-group my-3" style="max-width: 180px;">
    <button class="btn btn-outline-dark" (click)="decreaseQuantity()">
      -
    </button>

    <input
      type="text"
      class="form-control text-center fw-bold"
      [value]="quantity"
      readonly
    >

    <button class="btn btn-outline-dark" (click)="increaseQuantity()">
      +
    </button>
  </div>

  <p class="fw-semibold">
    Total:
    <span class="text-success">
      {{ productDetails.price * quantity }} EGP
    </span>
  </p>

</div>
        <button class="btn btn-success w-100">
          Add to Cart
        </button>
      </div>

    </div>
  </div>
</section>
